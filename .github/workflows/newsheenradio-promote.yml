# Newsheen Radio promote: mark a release VERIFIED after hardware verification.
#
# The scriptkitty release-channel contract: prerelease = untested auto-build,
# full release = verified on real hardware. This workflow does the promotion:
#   1. attaches verification-<device>.json evidence to the release
#   2. flips prerelease -> full release
#   3. pings the scriptkitty.sh flasher so the new default goes live
#
# Run it AFTER you (or the workbench) actually flashed the bin and confirmed
# boot + CLI + LED ring. Never promote a build you didn't test.
#
#   gh workflow run newsheenradio-promote.yml -f tag=newsheenradio-v1.6-sk.2 \
#      -f device=newsheen -f method=human -f notes="banner + HIZ> + led ring OK"
name: Newsheen Radio Promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to promote (e.g. newsheenradio-v1.6-sk.2)"
        type: string
        required: true
      device:
        description: "Which device build was verified"
        type: choice
        options: [newsheen, all]
        required: true
      method:
        description: "How it was verified"
        type: choice
        options: [human, workbench]
        required: true
      notes:
        description: "What was checked (boot, CLI, LED ring, LoRa…)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Attach verification evidence + flip to full release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DEVICE: ${{ inputs.device }}
          METHOD: ${{ inputs.method }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName \
            || { echo "::error::release $TAG not found"; exit 1; }

          if [ "$DEVICE" = "all" ]; then DEVICES="newsheen"; else DEVICES="$DEVICE"; fi
          for d in $DEVICES; do
            python3 - "$d" <<'PY'
          import json, os, sys, datetime
          d = sys.argv[1]
          json.dump({
              "target": d,
              "method": os.environ["METHOD"],
              "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d"),
              "verified_by": os.environ.get("GITHUB_ACTOR", ""),
              "notes": os.environ.get("NOTES", ""),
              "workflow_run": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, open(f"verification-{d}.json", "w"), indent=2)
          PY
            gh release upload "$TAG" "verification-$d.json" --repo "$GITHUB_REPOSITORY" --clobber
            echo "attached verification-$d.json ($METHOD)"
          done

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false
          echo "$TAG promoted to VERIFIED"

      - name: Ping scriptkitty.sh flasher
        env:
          SK_TOKEN: ${{ secrets.SCRIPTKITTY_DISPATCH_TOKEN }}
        run: |
          if [ -n "$SK_TOKEN" ]; then
            curl -sf -X POST \
              -H "Authorization: Bearer $SK_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/RetiaLLC/scriptkitty.sh/dispatches \
              -d '{"event_type":"channel-release"}' \
              && echo "flasher rebuild triggered" \
              || echo "::warning::dispatch to scriptkitty.sh failed — site picks this up on its weekly cron"
          else
            echo "::notice::SCRIPTKITTY_DISPATCH_TOKEN not set — site picks this up on its weekly cron or a manual run"
          fi
