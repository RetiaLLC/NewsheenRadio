; Newsheen Speaker Demo — I2S audio for the Pusheen puck (esp32_base_puck_v2)
;   MAX98357A I2S class-D amp on the J3 sensor header, 8x WS2812B VU meter on GPIO16.
;   Talks (SAM TTS), sings (chiptune synth), and plays MP3s from LittleFS.
;
; Build:   ~/firmware-lab/.venv313/bin/pio run -e newsheen-speaker
; Filesys: ~/firmware-lab/.venv313/bin/pio run -e newsheen-speaker -t uploadfs   (ships data/*.mp3)
; Merge:   see README.md  ->  dist/newsheen-speaker-demo.factory.bin
;
; Wiring is selected here. STRAIGHT = the boards bolted face to face, J3 pin-for-pin
; onto the amp's 7-pin header (GND and VIN land on their own names). See README.md.

; NOTE ON THE PLATFORM: ESP8266Audio 2.4.x includes <driver/i2s_std.h>, the IDF5 I2S
; driver, so this needs an arduino-esp32 3.x core. The tasmota 2024.06.00 platform used
; by the other puck projects is arduino-esp32 2.0.x (IDF 4.4) and will NOT compile it.
[env:newsheen-speaker]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
  earlephilhower/ESP8266Audio @ ^2.4.1
  earlephilhower/ESP8266SAM @ ^1.1.0
  adafruit/Adafruit NeoPixel @ ^1.12.3
  bblanchon/ArduinoJson @ ^7.0.0
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  ; ---- pick ONE wiring ----
  -DNEWSHEEN_WIRING_STRAIGHT      ; J3 straight across to the amp header (default)
  -DNETFILL_CORE=1                ; producer alongside the decoder. UNPROVEN: the A/B was
  ;                                 invalidated by RSSI drift (-35 to -88 dBm). Retest under
  ;                                 controlled RF before treating this as a win.
  ; -DNEWSHEEN_WIRING_CLASSIC     ; use the silkscreened I2S pins 37/38/39 instead

; Same firmware, conventional I2S wiring (37_WS->LRC, 38_SCK->BCLK, 39_SD->DIN).
[env:newsheen-speaker-classic]
extends = env:newsheen-speaker
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DNEWSHEEN_WIRING_CLASSIC
